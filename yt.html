<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>YouTube</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
  #msg { color: #aaa; font: 16px sans-serif; padding: 24px; }
</style>
</head>
<body>
<iframe id="p" allowfullscreen
        allow="autoplay; encrypted-media; fullscreen"
        referrerpolicy="strict-origin-when-cross-origin"></iframe>
<div id="msg" style="display:none">Не вказано відео (?v=ID).</div>
<script>
  // Використання: yt.html?v=<11-символьний ID відео YouTube>
  var m = /[?&]v=([A-Za-z0-9_-]{11})/.exec(location.search);
  if (m) {
    document.getElementById('p').src =
      'https://www.youtube.com/embed/' + m[1] +
      '?autoplay=1&playsinline=1&rel=0&origin=' + encodeURIComponent(location.origin);
  } else {
    document.getElementById('p').style.display = 'none';
    document.getElementById('msg').style.display = 'block';
  }
</script>
</body>
</html>
